# Build infra/Dockerfile.api on GitHub (amd64 — required by Render prebuilt images)
# and push to GHCR. Render then only *pulls* the image (saves Render pipeline minutes).

name: Publish API image

on:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - "processor/**"
      - "infra/**"
      - "requirements.txt"
      - "requirements-core.txt"
      - ".dockerignore"
      - ".github/workflows/publish-api-image.yml"
  workflow_dispatch:

env:
  # Slim build: CPU-only torch, no RVC extras, Redis+worker+API in one
  # container (~3.3 GB vs 14 GB) — fits free hosts like Render / HF Spaces.
  DOCKERFILE: ./infra/Dockerfile.slim

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: GHCR image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build and push (linux/amd64 for Render)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy (optional)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS "$HOOK"; else echo "Optional: set RENDER_DEPLOY_HOOK_URL to redeploy Render after each image push."; fi
