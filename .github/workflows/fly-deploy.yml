# Build infra/Dockerfile.api on Fly's remote builder and deploy (no GHCR).
#
# Setup:
#   1. fly.toml → unique `app` name, then locally: fly apps create <name>
#   2. fly secrets set APP_REDIS_URL="..." APP_CORS_ORIGINS='["https://..."]'
#   3. GitHub → Settings → Secrets → Actions → FLY_API_TOKEN
#      Create token: fly tokens create deploy -x 8760h

name: Deploy API to Fly.io

on:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - "processor/**"
      - "infra/**"
      - "requirements.txt"
      - ".dockerignore"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "Add repository secret FLY_API_TOKEN (fly tokens create deploy -x 8760h)"
            exit 1
          fi
          flyctl deploy \
            --config fly.toml \
            --ha=false \
            --wait-timeout 15m \
            --remote-only \
            --yes
