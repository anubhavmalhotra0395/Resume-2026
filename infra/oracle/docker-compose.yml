# Doctavox on an Oracle Cloud Ampere A1 (ARM64) VM.
#
#   cd ~/doctavox/infra/oracle && docker compose up -d --build
#
# Build context is the repo root. Uses Dockerfile.slim (torch-free onnxruntime stack — the
# CUDA wheels in requirements.txt have no aarch64 build and would fail here).
# Redis, API and worker are separate services so the worker can be restarted
# or scaled without dropping the API; Caddy terminates TLS on 80/443.

name: doctavox

x-app: &app
  build:
    context: ../..
    dockerfile: infra/Dockerfile.slim
  image: doctavox-api:latest
  restart: unless-stopped
  env_file:
    - .env
  environment:
    APP_REDIS_URL: redis://redis:6379/0
    APP_STORAGE_ROOT: /data
    PYTHONUNBUFFERED: "1"
  volumes:
    - app-data:/data
  networks:
    - internal

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  api:
    <<: *app
    # start_all_in_one.sh (the image default) boots its own Redis + worker.
    # Here those are real services, so run uvicorn directly.
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    # Bound to loopback: reachable for `curl` on the VM, never from the
    # internet. Public traffic arrives through Caddy on 443.
    ports:
      - "127.0.0.1:8000:8000"
    # YAML merge replaces lists, so the anchor's volume must be repeated.
    # The UI is not in the git repo (deployed separately) — when a copy is
    # placed at <repo>/doctavox on the host, the API serves it at
    # /doctavox/, making the VM a complete one-URL app.
    volumes:
      - app-data:/data
      - ../../doctavox:/app/doctavox:ro
    depends_on:
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: python -m processor.worker
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set in .env — bootstrap.sh defaults it to <dashed-public-ip>.sslip.io
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in infra/oracle/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data     # Let's Encrypt certs + account keys — keep this
      - caddy-config:/config
      # app storage read-only at /appdata (NOT /data — that's caddy's certs)
      - app-data:/appdata:ro
    depends_on:
      - api
    networks:
      - internal

volumes:
  redis-data:
  app-data:
  caddy-data:
  caddy-config:

networks:
  internal:
