version: "3.9"

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    # Load secrets from infra/.env into the container (avoids empty ${VAR:-} overriding real values on Windows).
    env_file:
      - .env
    environment:
      - APP_REDIS_URL=redis://redis:6379/0
      - APP_STORAGE_ROOT=/data
      - APP_DELETE_AFTER_HOURS=24
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ..:/app
      - ./storage:/data
      - ../models:/app/models
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    environment:
      - APP_REDIS_URL=redis://redis:6379/0
      - APP_STORAGE_ROOT=/data
      - APP_DELETE_AFTER_HOURS=24
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      - ..:/app
      - ./storage:/data
      - ../models:/app/models
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started


