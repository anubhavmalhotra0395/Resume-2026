# Fly.io — Doc vocal API (FastAPI + Docker)
#
# One-time setup:
#   1. Install CLI: https://fly.io/docs/hands-on/install-flyctl/
#   2. fly auth login
#   3. Pick a globally unique `app` name below, then: fly apps create <that-name>
#   4. fly secrets set APP_REDIS_URL="redis://default:PASSWORD@HOST:6379"
#   5. fly secrets set APP_CORS_ORIGINS='["https://YOUR-APP.vercel.app"]'
#   6. fly deploy --ha=false --wait-timeout 15m
#
# CI: push to main/master (see paths in .github/workflows/fly-deploy.yml) deploys
# via Fly's remote builder — add GitHub secret FLY_API_TOKEN.
#
# Logs: fly logs
# Open URL: fly status

app = "doc-vocal-api"
primary_region = "iad"

[build]
  dockerfile = "infra/Dockerfile.api"

[env]
  PORT = "8000"
  APP_ENABLE_WORKER = "0"
  APP_STORAGE_ROOT = "/app/storage"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 25

  [http_service.http_options]
    idle_timeout = 600

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "180s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
