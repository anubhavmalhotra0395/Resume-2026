<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a}
  #game{width:100%;max-width:100%;height:100%}
  /* Hide EmulatorJS bottom menu bar + context menu so it never appears
     over the virtual keypad on mobile. The host page already provides
     navigation (Game Select / Back to Room) in its own toolbar. */
  .ejs_menu_bar,
  .ejs_menu_bar_hidden,
  .ejs_menu_button,
  .ejs_context_menu,
  .ejs_settings_parent,
  .ejs_cheat_parent,
  .ejs_netplay_parent,
  .ejs_cache_parent,
  .ejs_control_parent { display: none !important; }
  /* The top status bar / cog button some cores show on tap. */
  .ejs_menu_bar.ejs_menu_bar_top,
  .ejs_menu_bar_top { display: none !important; }
</style>
</head>
<body>
<div id="game"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  EJS_player = '#game';
  EJS_core = params.get('core') || 'gb';
  EJS_gameUrl = params.get('rom') || '';
  EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
  EJS_color = '#1a1a2e';
  EJS_startOnLoaded = true;
  EJS_language = 'en-US';
  EJS_disableAutoLang = true;
  EJS_alignStartButton = "center";
  EJS_backgroundBlur = false;
  // Hide every built-in EmulatorJS UI button so the floating settings
  // bar can't peek through the virtual keypad on mobile.
  EJS_Buttons = {
    playPause: false,
    restart: false,
    mute: false,
    settings: false,
    fullscreen: false,
    saveState: false,
    loadState: false,
    screenRecord: false,
    gamepad: false,
    cheat: false,
    volume: false,
    saveSavFiles: false,
    loadSavFiles: false,
    quickSave: false,
    quickLoad: false,
    screenshot: false,
    cacheManager: false,
    exitEmulation: false,
    contextMenuButton: false,
    diskButton: false,
    netplay: false
  };

  EJS_VirtualGamepadSettings = [
    {
      type: "dpad",
      location: "left",
      left: "50%",
      right: "50%",
      joystickInput: false,
      inputValues: [4, 5, 6, 7]
    },
    {
      type: "button",
      text: "A",
      id: "a",
      location: "right",
      left: 40,
      top: 40,
      bold: true,
      input_value: 0
    },
    {
      type: "button",
      text: "B",
      id: "b",
      location: "right",
      left: -10,
      top: 70,
      bold: true,
      input_value: 1
    },
    {
      type: "button",
      text: "Select",
      id: "select",
      location: "right",
      left: 6,
      top: 118,
      fontSize: 14,
      input_value: 2
    },
    {
      type: "button",
      text: "Start",
      id: "start",
      location: "right",
      left: 52,
      top: 118,
      fontSize: 14,
      input_value: 3
    }
  ];

  // Suppress right-click / long-press context menu inside the emulator,
  // because some mobile browsers raise it from the canvas itself.
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });
</script>
<script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>
<script>
  // Belt-and-suspenders: after the player mounts, walk the shadow DOM and
  // remove any menu/context bars that EmulatorJS might have injected.
  function stripEjsChrome() {
    var sels = [
      '.ejs_menu_bar', '.ejs_menu_button', '.ejs_context_menu',
      '.ejs_settings_parent', '.ejs_cheat_parent', '.ejs_netplay_parent',
      '.ejs_cache_parent', '.ejs_control_parent'
    ];
    sels.forEach(function (s) {
      document.querySelectorAll(s).forEach(function (el) {
        el.style.display = 'none';
        el.style.pointerEvents = 'none';
        el.style.visibility = 'hidden';
      });
    });
  }
  setInterval(stripEjsChrome, 700);
</script>
</body>
</html>
