<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a}#game{width:100%;max-width:100%;height:100%}</style>
</head>
<body>
<div id="game"></div>
<script>
  var params = new URLSearchParams(window.location.search);
  EJS_player = '#game';
  EJS_core = params.get('core') || 'gb';
  EJS_gameUrl = params.get('rom') || '';
  EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
  EJS_color = '#1a1a2e';
  EJS_startOnLoaded = true;
  EJS_language = 'en-US';
  EJS_disableAutoLang = true;

  EJS_VirtualGamepadSettings = [
    {
      type: "dpad",
      location: "left",
      left: "50%",
      right: "50%",
      joystickInput: false,
      inputValues: [4, 5, 6, 7]
    },
    {
      type: "button",
      text: "A",
      id: "a",
      location: "right",
      left: 40,
      top: 40,
      bold: true,
      input_value: 0
    },
    {
      type: "button",
      text: "B",
      id: "b",
      location: "right",
      left: -10,
      top: 70,
      bold: true,
      input_value: 1
    },
    {
      type: "button",
      text: "Start",
      id: "start",
      location: "center",
      left: 60,
      fontSize: 15,
      block: true,
      input_value: 3
    },
    {
      type: "button",
      text: "Select",
      id: "select",
      location: "center",
      left: -5,
      fontSize: 15,
      block: true,
      input_value: 2
    }
  ];
</script>
<script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>
</body>
</html>
