<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a}#game{width:100%;max-width:100%;height:100%}</style>
</head>
<body>
<div id="game"></div>
<script>
  // Intercept localization fetches that 404 on the CDN so EmulatorJS doesn't crash
  const _fetch = window.fetch;
  window.fetch = function() {
    const url = arguments[0];
    if (typeof url === 'string' && url.includes('/localization/')) {
      return _fetch.apply(this, arguments).then(function(r) {
        if (!r.ok) return new Response('{}', {status:200, headers:{'Content-Type':'application/json'}});
        return r;
      });
    }
    return _fetch.apply(this, arguments);
  };

  const params = new URLSearchParams(window.location.search);
  EJS_player = '#game';
  EJS_core = params.get('core') || 'gb';
  EJS_gameUrl = params.get('rom') || '';
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  EJS_color = '#1a1a2e';
  EJS_startOnLoaded = true;
  EJS_defaultControls = true;
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
