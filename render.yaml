# Render pulls a *prebuilt* image from GHCR — no Dockerfile build on Render (saves pipeline minutes).
#
# 1. Push this repo to GitHub; run workflow "Publish API image" once (Actions tab).
# 2. GitHub → Packages → open the package → set visibility to **Public** (easiest), OR add GHCR
#    credentials in Render and use `image.creds` (see Render prebuilt image docs).
# 3. Replace the image url below with yours: ghcr.io/<github-owner-lowercase>/<repo-lowercase>:latest
#    (must match the package Actions publishes.)
# 4. If you changed from an old Dockerfile-based service, create a *new* web service from this
#    Blueprint — Render does not allow switching runtime docker → image on an existing service.
#
# After each GHCR push, Render does not auto-pull a new digest for :latest unless you redeploy.
# Add GitHub secret RENDER_DEPLOY_HOOK_URL (Render → service → Settings → Deploy hook) so the
# workflow can POST to it after each image push.

services:
  - type: web
    name: vocalforge-api
    runtime: image
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /healthz
    image:
      url: ghcr.io/anubhavmalhotra0395/resume-2026:latest
    envVars:
      # The slim image boots its own Redis inside the container.
      - key: APP_REDIS_URL
        value: redis://localhost:6379/0
      - key: APP_STORAGE_ROOT
        value: /tmp/storage
      - key: APP_DELETE_AFTER_HOURS
        value: "24"
      - key: APP_CORS_ORIGINS
        value: "[\"*\"]"
      - key: APP_FOOTBALL_DATA_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # In-container RQ worker so jobs actually process. Free tier has
      # 512 MB RAM — light DSP jobs work; heavy stem separation may OOM
      # (upgrade path: HF Spaces Docker, 16 GB free, no card).
      - key: APP_ENABLE_WORKER
        value: "1"
